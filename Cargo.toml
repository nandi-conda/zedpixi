[package]
name = "zed-pixi"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
zed_extension_api = "0.7.0"

[features]
# Builds the native `pixi-env-check` binary: it resolves a pixi environment and
# verifies that tools come from that environment, without Zed.
native-check = []

[[bin]]
name = "pixi-env-check"
path = "src/bin/pixi_env_check.rs"
required-features = ["native-check"]
