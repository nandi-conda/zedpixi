id = "pixi"
name = "Pixi"
description = "Makes Zed use your project's pixi environment for its own language servers, debug adapters, tasks and formatters."
version = "0.2.0"
schema_version = 1
authors = ["Pixi extension contributors"]

# This extension intentionally registers no language servers, context servers
# or slash commands. Zed's built-in language servers, debug adapters, tasks and
# formatters keep working as usual; project settings point them at the pixi
# environment, and this extension provides the resolved environment and its
# `bin` directory (see README.md).

# Zed only lets an extension run commands it declares here. The extension runs
# `pixi info --json --manifest-path` to resolve the project environment, and
# uses the shell only to test whether a path inside the environment is
# executable.
#
# The command is `*` because pixi is resolved through the worktree's PATH
# (`worktree.which("pixi")`) and is therefore spawned by its absolute path,
# which an exact `command = "pixi"` would reject. The arguments are fixed to
# this one read-only query.
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["info", "--json", "--manifest-path", "*"]

[[capabilities]]
kind = "process:exec"
command = "/bin/sh"
args = ["-c", "**"]

[[capabilities]]
kind = "process:exec"
command = "powershell"
args = ["-NoProfile", "-NonInteractive", "-Command", "*"]
